<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أثر - الرئيسية</title>
    <!-- استدعاء خط Cairo وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-image: url('خلفيه موقع اثر.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* تصميم ترحيب باسم المستخدم في الزاوية العلوية (بشكل مرتب وأنيق) */
        .user-welcome-badge {
            position: absolute;
            top: 25px;
            left: 45px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(15, 61, 89, 0.08);
            border: 1px solid rgba(15, 61, 89, 0.1);
        }

        .user-avatar-circle {
            width: 36px;
            height: 36px;
            background: #0f3d59;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .user-text-info {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .welcome-mini-text {
            font-size: 10.5px;
            color: #64748b;
            font-weight: 600;
        }

        .user-name-text {
            font-size: 14px;
            color: #0f3d59;
            font-weight: 800;
        }

        /* الحاوية الرئيسية (القائمة يمين والمربع يسار) */
        .dashboard-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1250px;
            gap: 35px;
            margin-top: 20px;
        }

        /* مساحة العمل البيضاء الكبيرة في اليسار (فارغة تماماً) */
        .main-content-card {
            flex: 1;
            height: 570px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(15, 61, 89, 0.08);
            padding: 30px;
        }

        /* الشريط الجانبي والقائمة في اليمين */
        .sidebar-section {
            width: 250px;
            background: rgba(248, 250, 252, 0.95);
            border-radius: 20px;
            padding: 25px 15px;
            box-shadow: 0 10px 30px rgba(15, 61, 89, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidebar-logo img {
            width: 110px;
            height: auto;
            margin-bottom: 25px;
            object-fit: contain;
        }

        .sidebar-menu {
            list-style: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-menu li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 16px;
            color: #334155;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        /* العنصر النشط (الرئيسية) */
        .sidebar-menu li.active a {
            background-color: #0f3d59;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 61, 89, 0.15);
        }

        .sidebar-menu li a:hover:not(.active) {
            background-color: #e2e8f0;
            color: #0f3d59;
        }

        .sidebar-menu li a i {
            font-size: 15px;
            width: 20px;
            text-align: center;
        }

        /* زر تسجيل الخروج بالأحمر في الأسفل */
        .logout-btn {
            color: #dc2626 !important;
            margin-top: 15px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px !important;
        }

        .logout-btn:hover {
            background-color: #ffeeef !important;
            color: #dc2626 !important;
        }
    </style>
</head>
<body>

    <!-- ترحيب باسم المستخدم في الزاوية بطريقة أنيقة ومرتبة -->
    <div class="user-welcome-badge">
        <div class="user-avatar-circle">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="user-text-info">
            <span class="welcome-mini-text">مرحباً بك،</span>
            <span class="user-name-text" id="displayUserName">اسم المستخدم</span>
        </div>
    </div>

    <!-- الحاوية الرئيسية -->
    <div class="dashboard-container">
        
        <!-- مساحة العمل البيضاء الكبيرة في اليسار (فارغة تماماً) -->
        <div class="main-content-card">
            <!-- فارغة تماماً بناءً على طلبك -->
        </div>

        <!-- الشريط الجانبي والقائمة في اليمين -->
        <div class="sidebar-section">
            <div class="sidebar-logo">
                <img src="logo.png" alt="شعار منصة أثر">
            </div>

            <ul class="sidebar-menu">
                <li class="active">
                    <a href="dashboard.html">
                        <span>الرئيسية</span>
                        <i class="fa-solid fa-house"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>المبادرات</span>
                        <i class="fa-solid fa-folder-open"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>المؤشرات</span>
                        <i class="fa-solid fa-chart-line"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>البيانات</span>
                        <i class="fa-solid fa-database"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>التقارير</span>
                        <i class="fa-solid fa-file-lines"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>المستفيدون</span>
                        <i class="fa-solid fa-users"></i>
                    </a>
                </li>
                <li>
                    <a href="index.html" class="logout-btn">
                        <span>تسجيل الخروج</span>
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </a>
                </li>
            </ul>
        </div>

    </div>

    <!-- جلب اسم المستخدم المخزن تلقائياً -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('athalUser');
            if (savedName) {
                document.getElementById('displayUserName').textContent = savedName;
            }
        });
    </script>
</body>
</html>
