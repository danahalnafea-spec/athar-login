<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أثر - لوحة التحكم</title>
    <!-- استدعاء خط Cairo وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-image: url('bg-dashboard.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            direction: rtl;
        }

        /* القسم الأيسر: المحتوى المتجاوب */
        .main-content-area {
            flex: 1;
            min-height: 100vh;
            padding: 4vh 4vw;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            min-width: 0;
        }

        /* الهيدر العلوي */
        .header-top-wrapper {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-direction: row;
            margin-top: 1vh;
        }

        /* شريط اسم المستخدم وقائمة الصلاحية المنسدلة */
        .top-user-bar-container {
            position: relative;
        }

        .top-user-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 3px 10px rgba(11, 37, 58, 0.05);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .top-user-bar:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .user-avatar-circle {
            width: 36px;
            height: 36px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0b253a;
            box-shadow: 0 2px 5px rgba(11, 37, 58, 0.1);
            flex-shrink: 0;
        }

        .user-avatar-circle i {
            font-size: 15px;
        }

        .user-name-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            color: #0b253a;
            white-space: nowrap;
        }

        .user-name-dropdown i {
            font-size: 10px;
            color: #0b253a;
            transition: transform 0.3s ease;
        }

        .top-user-bar.active .user-name-dropdown i {
            transform: rotate(180deg);
        }

        /* القائمة المنسدلة (عرض الصلاحية للقراءة فقط) */
        .user-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 170px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(11, 37, 58, 0.12);
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            border: 1px solid rgba(11, 37, 58, 0.08);
            text-align: right;
        }

        .user-dropdown-menu.show {
            display: flex;
        }

        .dropdown-header-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            padding: 0 6px;
        }

        .dropdown-role-display {
            background: #f1f5f9;
            color: #0b253a;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: default;
        }

        .dropdown-role-display i {
            color: #4e9cd8;
            font-size: 12px;
        }

        /* عبارة الترحيب في جهة اليسار */
        .welcome-center-section {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .welcome-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .welcome-center-section h1 {
            font-size: clamp(20px, 2.2vw, 28px);
            font-weight: 900;
            color: #0b253a;
            white-space: nowrap;
        }

        .welcome-center-section p {
            font-size: clamp(10px, 1vw, 13px);
            color: #64748b; 
            font-weight: 600;
            white-space: nowrap;
        }

        .welcome-underline {
            width: 45px;
            height: 3px;
            background-color: #4e9cd8;
            border-radius: 2px;
            margin-top: 4px;
        }

        /* الشريط الجانبي في اليمين */
        .sidebar-right {
            width: 290px; 
            min-height: 100vh;
            background-color: #eaf4fc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 15px 20px 15px;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
            border-left: 1px solid rgba(15, 61, 89, 0.08);
        }

        .sidebar-top-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidebar-logo {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 5px; 
        }

        .sidebar-logo img {
            width: 260px; 
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .sidebar-menu {
            list-style: none !important;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            list-style: none !important;
            width: 100%;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-direction: row-reverse;
            gap: 12px;
            padding: 9px 14px;
            color: #0b253a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .sidebar-menu li.active a {
            background-color: #d1e7fb; 
            color: #0b253a;
            font-weight: 800;
        }

        .sidebar-menu li a:hover:not(.active) {
            background-color: rgba(59, 130, 246, 0.08);
        }

        .sidebar-menu li a i {
            font-size: 15px;
            width: 20px;
            text-align: center;
            color: #0b253a;
        }

        .sidebar-bottom-content {
            width: 100%;
            border-top: 1px solid rgba(15, 61, 89, 0.12);
            padding-top: 8px;
        }

        .logout-link {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-direction: row-reverse;
            gap: 12px;
            padding: 9px 14px;
            color: #0b253a !important;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .logout-link i {
            font-size: 15px;
            color: #0b253a !important;
            width: 20px;
            text-align: center;
        }

        .logout-link:hover {
            background-color: rgba(220, 38, 38, 0.1);
            color: #dc2626 !important;
        }

        .logout-link:hover i {
            color: #dc2626 !important;
        }

        /* --- نظام التجاوب الدقيق لشاشات الجوال والآيباد --- */
        @media (max-width: 992px) {
            body {
                flex-direction: column-reverse;
                overflow-y: auto;
                height: auto;
            }

            .sidebar-right {
                width: 100%;
                min-height: auto;
                border-left: none;
                border-top: 1px solid rgba(15, 61, 89, 0.08);
                padding: 15px;
            }

            .main-content-area {
                width: 100%;
                min-height: auto;
                padding: 20px;
            }

            .header-top-wrapper {
                flex-direction: column-reverse;
                align-items: center;
                gap: 20px;
                text-align: center;
            }

            .welcome-center-section {
                text-align: center;
                align-items: center;
                width: 100%;
            }

            .welcome-title-wrapper {
                justify-content: center;
            }

            .welcome-center-section p {
                white-space: normal;
            }

            .top-user-bar-container {
                width: 100%;
                display: flex;
                justify-content: center;
            }

            .user-dropdown-menu {
                right: 50%;
                transform: translateX(50%);
            }
        }
    </style>
</head>
