<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أثر - الرئيسية</title>
    <!-- استدعاء خط Cairo وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-image: url('خلفيه موقع اثر.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* الحاوية الرئيسية */
        .dashboard-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1250px;
            gap: 35px;
        }

        /* مساحة العمل البيضاء الكبيرة في اليسار (مطابقة للصورة تماماً) */
        .main-content-card {
            flex: 1;
            height: 570px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(15, 61, 89, 0.08);
            padding: 30px;
        }

        /* الشريط الجانبي والقائمة في اليمين (مطابق للصورة) */
        .sidebar-section {
            width: 270px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الشعار في أعلى اليمين تماماً كما في صورتك */
        .sidebar-logo {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
            padding-right: 15px;
        }

        .sidebar-logo img {
            width: 150px;
            height: auto;
            object-fit: contain;
        }

        .sidebar-menu {
            list-style: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* تنسيق الروابط بحيث تكون الأيقونة على اليمين والنص بجانبها تماماً مثل صورتك */
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            padding: 12px 18px;
            color: #0f3d59;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        /* العنصر النشط (الرئيسية) بلون خفيف متناسق مع صورتك */
        .sidebar-menu li.active a {
            background-color: rgba(15, 61, 89, 0.12);
            color: #0f3d59;
        }

        .sidebar-menu li a:hover:not(.active) {
            background-color: rgba(15, 61, 89, 0.06);
        }

        /* حجم ولون الأيقونات لتطابق صورتك بدقة */
        .sidebar-menu li a i {
            font-size: 18px;
            color: #0f3d59;
            width: 22px;
            text-align: center;
        }

        /* زر تسجيل الخروج في الأسفل بنفس اللون الهادئ */
        .logout-btn {
            color: #0f3d59 !important;
            margin-top: 15px;
            border-top: 1px solid rgba(15, 61, 89, 0.1);
            padding-top: 15px !important;
        }

        .logout-btn i {
            color: #0f3d59 !important;
        }

        .logout-btn:hover {
            background-color: rgba(220, 38, 38, 0.08) !important;
            color: #dc2626 !important;
        }

        .logout-btn:hover i {
            color: #dc2626 !important;
        }
    </style>
</head>
<body>

    <!-- الحاوية الرئيسية -->
    <div class="dashboard-container">
        
        <!-- مساحة العمل البيضاء الكبيرة في اليسار (فارغة تماماً) -->
        <div class="main-content-card">
            <!-- فارغة تماماً بناءً على طلبك -->
        </div>

        <!-- الشريط الجانبي والقائمة في اليمين -->
        <div class="sidebar-section">
            <div class="sidebar-logo">
                <img src="logo.PNG" alt="شعار منصة أثر">
            </div>

            <ul class="sidebar-menu">
                <li class="active">
                    <a href="dashboard.html">
                        <span>الرئيسية</span>
                        <i class="fa-solid fa-house"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>المبادرات</span>
                        <i class="fa-solid fa-folder-open"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>المؤشرات</span>
                        <i class="fa-solid fa-chart-line"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>البيانات</span>
                        <i class="fa-solid fa-database"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>التقارير</span>
                        <i class="fa-solid fa-file-lines"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span>المستفيدون</span>
                        <i class="fa-solid fa-users"></i>
                    </a>
                </li>
                <li>
                    <a href="index.html" class="logout-btn">
                        <span>تسجيل الخروج</span>
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </a>
                </li>
            </ul>
        </div>

    </div>

</body>
</html>
