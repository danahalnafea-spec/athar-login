<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة أثر</title>
    <!-- استدعاء خط Cairo وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-image: url('bg.png'); /* تأكدي أن اسم صورة الخلفية مطابق تماماً لديكِ */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* صندوق تسجيل الدخول في المنتصف */
        .login-card {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(15, 61, 89, 0.08);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .login-logo img {
            width: 130px;
            height: auto;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .login-title {
            font-size: 22px;
            font-weight: 900;
            color: #0f3d59;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            width: 100%;
            text-align: right;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #0f3d59;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            color: #1e293b;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #0f3d59;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(15, 61, 89, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background-color: #0f3d59;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
        }

        .login-btn:hover {
            background-color: #164e70;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">
            <img src="logo.PNG" alt="شعار منصة أثر">
        </div>
        <h1 class="login-title">مرحباً بك في منصة أثر</h1>
        <p class="login-subtitle">أدخل اسمك وحدد صلاحيتك للمتابعة</p>

        <form action="dashboard.html" method="GET" style="width: 100%;">
            <div class="form-group">
                <label class="form-label">الاسم</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" class="form-control" placeholder="اكتب اسمك هنا" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">نوع المستخدم</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="text" class="form-control" placeholder="مستخدم عادي" required>
                </div>
            </div>

            <a href="dashboard.html" class="login-btn">دخول إلى المنصة</a>
        </form>
    </div>

</body>
</html>
