<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أثر - المستفيدون والفئات المستهدفة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="min-h-screen flex flex-col">
        <header class="bg-emerald-800 text-white shadow-md py-4 px-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">منصة «أثر» - المستفيدون</h1>
            <span class="bg-emerald-700 text-xs px-3 py-1 rounded-full">البنت السابعة</span>
        </header>

        <main class="flex-1 max-w-4xl w-full mx-auto p-6 my-6 bg-white shadow-lg rounded-xl border border-gray-100">
            <div class="mb-6 border-b pb-4">
                <h2 class="text-2xl font-bold text-emerald-900">إدخال بيانات المستفيدين والفئات المستهدفة</h2>
                <p class="text-sm text-gray-500 mt-1">تحديد الفئة المستهدفة وعدد المستفيدين المرتبطين بالمبادرة[span_2](start_span)[span_2](end_span).</p>
            </div>

            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">الفئة المستهدفة (مثال: طلاب الجامعات، المجتمع المحلي...)</label>
                    <input type="text" placeholder="أدخل الفئة المستهدفة" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">عدد المستفيدين (أرقام صحيحة)</label>
                    <input type="number" min="1" placeholder="مثال: 150" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
                </div>

                <div class="flex justify-end gap-4 pt-4 border-t">
                    <button type="submit" class="px-6 py-2 bg-emerald-600 text-white font-semibold rounded-lg hover:bg-emerald-700">حفظ البيانات</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
