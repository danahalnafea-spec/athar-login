<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>منصة أثر - المستفيدون</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sidebar-width: 280px;
            --navy: #0b253a;
            --blue: #4e9cd8;
            --page-bg: #f0f7ff;
            --sidebar-bg: #eaf4fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--page-bg);
            background-image: url('bg-dashboard.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            direction: rtl;
            overflow-x: hidden;
        }

        /* الشريط الجانبي */
        .sidebar-wrapper {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            transform: translateX(0);
        }

        .sidebar-wrapper.collapsed {
            transform: translateX(var(--sidebar-width));
        }

        .sidebar-right {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 15px 12px 20px;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.06);
            border-left: 1px solid rgba(15, 61, 89, 0.08);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-top-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .sidebar-logo {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            margin-top: 5px;
        }

        .sidebar-logo img {
            width: 195px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .sidebar-menu {
            list-style: none !important;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            list-style: none !important;
            width: 100%;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-direction: row-reverse;
            gap: 12px;
            padding: 10px 12px;
            color: var(--navy);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .sidebar-menu li.active a {
            background-color: #d1e7fb;
            color: var(--navy);
            font-size: 13.5px;
            font-weight: 600;
        }

        .sidebar-menu li a:hover:not(.active) {
            background-color: rgba(59, 130, 246, 0.08);
        }

        .sidebar-menu li a i {
            font-size: 14px;
            width: 20px;
            text-align: center;
            color: var(--navy);
        }

        /* زر السهم الثابت */
        .sidebar-toggle-btn {
            position: fixed !important;
            top: 20px !important;
            right: calc(var(--sidebar-width) + 15px) !important;
            width: 36px;
            height: 36px;
            background-color: var(--navy);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(11, 37, 58, 0.3);
            font-size: 13px;
            z-index: 100000;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, transform 0.3s ease;
        }

        body.sidebar-is-collapsed .sidebar-toggle-btn {
            right: 20px !important;
        }

        .sidebar-toggle-btn:hover {
            background-color: #16344e;
            transform: scale(1.1);
        }

        /* المحتوى الرئيسي */
        .main-content-area {
            flex: 1;
            min-height: 100vh;
            padding: 30px 3vw 50px;
            margin-right: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            position: relative;
            width: calc(100% - var(--sidebar-width));
            overflow-y: auto;
            transition: margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.sidebar-is-collapsed .main-content-area {
            margin-right: 0 !important;
            width: 100% !important;
        }

        .header-top-wrapper {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: row;
            margin-top: 1vh;
            margin-bottom: 24px;
            gap: 15px;
            position: relative;
            flex-shrink: 0;
        }

        .page-heading {
            text-align: right;
            min-width: 0;
        }

        .page-heading h1 {
            font-size: clamp(20px, 2.2vw, 28px);
            font-weight: 900;
            color: var(--navy);
            line-height: 1.7;
        }

        .page-heading p {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-top: 3px;
        }

        .heading-underline {
            width: 45px;
            height: 3px;
            background-color: var(--blue);
            border-radius: 2px;
            margin-top: 4px;
        }

        /* اسم المستخدم والقائمة المنسدلة */
        .top-user-bar-container {
            position: relative;
            flex-shrink: 0;
            z-index: 100;
        }

        .top-user-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 16px;
            border-radius: 30px;
            box-shadow: 0 3px 12px rgba(11, 37, 58, 0.08);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .top-user-bar:hover {
            background: #ffffff;
        }

        .user-avatar-circle {
            width: 36px;
            height: 36px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--navy);
            box-shadow: 0 2px 5px rgba(11, 37, 58, 0.1);
            flex-shrink: 0;
        }

        .user-name-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            color: var(--navy);
            white-space: nowrap;
        }

        .user-name-dropdown i {
            font-size: 10px;
            color: var(--navy);
            transition: transform 0.3s ease;
        }

        .top-user-bar.active .user-name-dropdown i {
            transform: rotate(180deg);
        }

        /* القائمة المنسدلة */
        .user-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: auto;
            width: 190px;
            max-width: calc(100vw - 30px);
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(11, 37, 58, 0.15);
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
            border: 1px solid rgba(11, 37, 58, 0.08);
            text-align: right;
        }

        @media (min-width: 768px) {
            .user-dropdown-menu {
                left: auto;
                right: 0;
            }
        }

        .user-dropdown-menu.show {
            display: flex;
        }

        .dropdown-header-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            padding: 0 6px;
        }

        .dropdown-role-display {
            background: #f1f5f9;
            color: var(--navy);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        /* بطاقات الإحصائيات */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            width: 100%;
        }

        .summary-card {
            width: 100%;
            min-height: 95px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e5edf5;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(11, 37, 58, 0.05);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .summary-card-content {
            min-width: 0;
        }

        .summary-label {
            display: block;
            color: #8190a5;
            font-size: 12px;
            line-height: 1.6;
            font-weight: 700;
        }

        .summary-value {
            display: block;
            color: var(--navy);
            font-size: 24px;
            line-height: 1.4;
            font-weight: 900;
            margin-top: 4px;
            overflow-wrap: anywhere;
        }

        .summary-icon {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: #e8f4ff;
            color: #4e9cd8;
        }

        .summary-card:nth-child(2) .summary-icon {
            background: #f0eaff;
            color: #8b68c7;
        }

        .summary-card:nth-child(3) .summary-icon {
            background: #e7f8ee;
            color: #29945a;
        }

        .summary-card:nth-child(4) .summary-icon {
            background: #fff4df;
            color: #b98523;
        }

        /* البحث والتصفية */
        .filter-toolbar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            width: 100%;
        }

        .filter-select,
        .search-box {
            height: 48px;
            border: 1px solid #e5eaf0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            color: var(--navy);
            box-shadow: 0 2px 8px rgba(11, 37, 58, 0.035);
        }

        .filter-select {
            width: 260px;
            max-width: 100%;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .search-box {
            flex: 1;
            min-width: 0;
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box i {
            color: #94a3b8;
            font-size: 14px;
        }

        .search-box input {
            width: 100%;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: var(--navy);
            font-size: 13px;
        }

        /* جدول المستفيدين */
        .table-panel {
            width: 100%;
            min-width: 0;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e5edf5;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(11, 37, 58, 0.045);
            overflow: hidden;
            margin-bottom: 25px;
        }

        .table-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 22px;
            border-bottom: 1px solid #edf1f5;
        }

        .table-heading h2 {
            color: var(--navy);
            font-size: 16px;
            font-weight: 900;
        }

        .table-heading p {
            color: #8190a5;
            font-size: 11px;
            margin-top: 3px;
        }

        .table-count {
            flex-shrink: 0;
            background: #e8f4ff;
            color: #347eaf;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
        }

        .beneficiaries-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            min-width: 760px;
        }

        .beneficiaries-table thead {
            background: #f7faff;
        }

        .beneficiaries-table th {
            padding: 15px 20px;
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            border-bottom: 1px solid #edf1f5;
        }

        .beneficiaries-table td {
            padding: 15px 20px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            vertical-align: middle;
            border-bottom: 1px solid #f0f3f7;
        }

        .initiative-name {
            color: var(--navy);
            font-size: 14px;
            font-weight: 900;
            line-height: 1.8;
        }

        .category-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .number-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            padding: 5px 10px;
            border-radius: 8px;
            background: #f1f7fd;
            color: var(--navy);
            font-size: 12px;
            font-weight: 900;
        }

        .unavailable {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
        }

        .details-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 12px;
            background: #f1f5f9;
            color: var(--navy);
            text-decoration: none;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .details-link:hover {
            background: var(--navy);
            color: #ffffff;
        }

        /* زر التعديل للمشرف */
        .admin-edit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 7px;
            padding: 7px 12px;
            background: #fff7e6;
            color: #9a6700;
            border: 1px solid #f5d58a;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .admin-edit-btn:hover {
            background: #f5d58a;
            color: #684600;
        }

        .details-cell {
            min-width: 140px;
        }

        .details-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .empty-state {
            padding: 40px 15px !important;
            text-align: center !important;
            color: #8190a5 !important;
            line-height: 2;
        }

        /* خلفية النافذة المنبثقة */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 200000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.50);
            backdrop-filter: blur(2px);
            overflow-y: auto;
        }

        .modal-overlay.hidden {
            display: none !important;
        }

        /* النافذة المنبثقة */
        .edit-modal {
            position: relative;
            width: 100%;
            max-width: 640px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: #ffffff;
            border-radius: 21px;
            padding: 28px 30px 30px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.22);
            text-align: right;
            animation: modalAppear 0.22s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-title {
            color: var(--navy);
            font-size: 24px;
            line-height: 1.7;
            font-weight: 900;
            margin-bottom: 17px;
        }

        .form-field {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-field label {
            color: #475569;
            font-size: 13px;
            font-weight: 800;
        }

        .modal-input,
        .modal-select {
            width: 100%;
            height: 54px;
            padding: 0 15px;
            border: 1px solid #e0e5ec;
            border-radius: 15px;
            background: #ffffff;
            color: var(--navy);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .modal-input:focus,
        .modal-select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(78, 156, 216, 0.12);
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            margin-top: 16px;
        }

        .impact-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 54px;
            padding: 0 12px;
            border: 1px solid #e0e5ec;
            border-radius: 15px;
            background: #ffffff;
        }

        .impact-input-wrapper:focus-within {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(78, 156, 216, 0.12);
        }

        .impact-input {
            width: 100%;
            min-width: 0;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--navy);
            font-size: 15px;
            font-weight: 600;
        }

        .impact-suffix {
            flex-shrink: 0;
            padding: 7px 12px;
            border-radius: 10px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        .groups-field {
            margin-top: 16px;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            margin-top: 26px;
        }

        .modal-button {
            min-width: 78px;
            padding: 11px 22px;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .modal-button:active {
            transform: scale(0.98);
        }

        .modal-save {
            background: var(--navy);
            color: #ffffff;
        }

        .modal-save:hover {
            background: #16344e;
        }

        .modal-cancel {
            background: #f1f3f6;
            color: #64748b;
        }

        .modal-cancel:hover {
            background: #e2e8f0;
        }

        .modal-help {
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.8;
            margin-top: 5px;
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            .sidebar-wrapper {
                transform: translateX(100%);
            }

            .sidebar-wrapper.mobile-open {
                transform: translateX(0);
            }

            .sidebar-toggle-btn {
                position: fixed !important;
                top: 18px !important;
                right: 18px !important;
                left: auto !important;
            }

            .main-content-area {
                margin-right: 0 !important;
                width: 100% !important;
                padding: 75px 24px 40px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .filter-toolbar {
                flex-direction: column;
                gap: 10px;
            }

            .filter-select {
                width: 100%;
            }

            .summary-card {
                padding: 12px;
                gap: 8px;
            }

            .summary-value {
                font-size: 20px;
            }

            .summary-icon {
                width: 36px;
                height: 36px;
                font-size: 15px;
            }

            .edit-modal {
                padding: 22px 18px;
                border-radius: 18px;
            }

            .modal-title {
                font-size: 21px;
            }

            .modal-grid {
                gap: 11px;
            }

            .modal-input,
            .modal-select,
            .impact-input-wrapper {
                height: 49px;
                font-size: 13px;
            }

            .modal-actions {
                margin-top: 20px;
            }

            .modal-button {
                padding: 10px 18px;
            }
        }

        @media (max-width: 380px) {
            .modal-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- زر السهم الثابت -->
    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="إخفاء/إظهار القائمة" type="button">
        <i class="fa-solid fa-chevron-right" id="toggleIcon"></i>
    </button>

    <!-- الشريط الجانبي -->
    <div class="sidebar-wrapper" id="sidebarWrapper">
        <aside class="sidebar-right">
            <div class="sidebar-top-content w-full flex flex-col items-center">

                <div class="sidebar-logo" style="margin-bottom: 15px; width: 100%; display: flex; justify-content: center;">
                    <img src="logo.png" alt="شعار منصة أثر" style="width: 140px; height: auto;">
                </div>

                <nav class="space-y-1.5 w-full">
                    <a href="dashboard.html" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl text-[#0b253a] hover:bg-blue-500/10 font-semibold transition text-sm">
                        <span>الرئيسية</span>
                        <i class="fa-solid fa-house w-5
