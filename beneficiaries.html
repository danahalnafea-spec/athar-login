<!-- العنوان وبيانات المستخدم -->
<header class="flex flex-wrap justify-between items-center gap-4 mb-7">
    <div>
        <h1 class="text-2xl md:text-3xl font-black">
            المستفيدون والفئات المستهدفة
        </h1>

        <div class="w-12 h-1 rounded mt-2"
             style="background:var(--blue)"></div>

        <p class="text-sm text-slate-500 mt-2">
            متابعة المستفيدين وتنظيم الفئات المرتبطة بالمبادرات.
        </p>
    </div>

    <div class="user-bar">
        <div class="avatar">
            <i class="fa-solid fa-user"></i>
        </div>
        <div>
            <div id="userName" class="font-bold text-sm">مستخدم</div>
            <div id="userRole" class="text-xs text-slate-500">مستخدم عادي</div>
        </div>
    </div>
</header>

<!-- الإحصائيات: أربع خانات كبيرة مثل الصورة -->
<section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-7">

    <div class="stat-card" style="min-height:150px; padding:22px;">
        <p class="text-sm text-slate-500 mb-3">إجمالي المستفيدين المسجلين</p>
        <p id="totalBeneficiaries" class="text-3xl font-black">0</p>
        <i class="fa-solid fa-users mt-4 text-lg"
           style="color:var(--blue)"></i>
    </div>

    <div class="stat-card" style="min-height:150px; padding:22px;">
        <p class="text-sm text-slate-500 mb-3">الفئات المستهدفة</p>
        <p id="totalGroups" class="text-3xl font-black">0</p>
        <i class="fa-solid fa-people-group mt-4 text-lg"
           style="color:var(--blue)"></i>
    </div>

    <div class="stat-card" style="min-height:150px; padding:22px;">
        <p class="text-sm text-slate-500 mb-3">المبادرات المرتبطة</p>
        <p id="totalInitiatives" class="text-3xl font-black">0</p>
        <i class="fa-solid fa-folder-open mt-4 text-lg"
           style="color:var(--blue)"></i>
    </div>

    <div class="stat-card" style="min-height:150px; padding:22px;">
        <p class="text-sm text-slate-500 mb-3">إجمالي العدد المستهدف</p>
        <p id="totalTarget" class="text-3xl font-black">غير متوفر</p>
        <i class="fa-solid fa-bullseye mt-4 text-lg"
           style="color:var(--blue)"></i>
    </div>

</section>
