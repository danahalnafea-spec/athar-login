<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة أثر - المبادرات</title>
    <!-- استدعاء Tailwind CSS وخط Cairo وأيقونات FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --sidebar-width: 280px; }
        * { font-family: 'Cairo', sans-serif; }
        body {
            background-color: #f0f7ff;
            background-image: url('bg-dashboard.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            direction: rtl;
        }
        .main-content-area {
            flex: 1;
            height: 100vh;
            padding: 4vh 3vw;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            position: relative;
            min-width: 0;
            overflow-y: auto;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-toggle-btn {
            position: fixed;
            top: 25px;
            right: calc(var(--sidebar-width) + 15px);
            transform: none;
            width: 34px;
            height: 34px;
            background-color: #0b253a;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(11, 37, 58, 0.25);
            font-size: 12px;
            z-index: 10000;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, transform 0.3s ease;
        }
        body.sidebar-is-collapsed .sidebar-toggle-btn { right: 20px; }
        .sidebar-toggle-btn:hover { background-color: #16344e; transform: scale(1.1); }
        .sidebar-wrapper {
            position: relative;
            display: flex;
            align-items: flex-start;
            flex-shrink: 0;
            height: 100vh;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            transform: translateX(0);
        }
        .sidebar-wrapper.collapsed { transform: translateX(var(--sidebar-width)); }
        .user-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 170px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(11, 37, 58, 0.12);
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            border: 1px solid rgba(11, 37, 58, 0.08);
            text-align: right;
        }
        .user-dropdown-menu.show { display: flex; }

        /* توحيد مظهر الحقول */
        #initiativeForm input, 
        #initiativeForm select {
            background-color: #ffffff !important;
            color: #0b253a !important;
            border: 1px solid #e5e7eb !important;
        }

        @media (max-width: 1024px) {
            .sidebar-wrapper {
                position: fixed;
                right: 0;
                top: 0;
                z-index: 9999;
                transform: translateX(var(--sidebar-width));
            }
            .sidebar-wrapper.mobile-open { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- زر السهم المتجاوب -->
    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="إخفاء/إظهار القائمة">
        <i class="fa-solid fa-chevron-right" id="toggleIcon"></i>
    </button>

    <!-- حاوية الشريط الجانبي في اليمين -->
    <div class="sidebar-wrapper" id="sidebarWrapper">
        <aside class="w-[280px] bg-[#eaf4fc] border-l border-[#0f3d59]/15 h-screen p-4 flex flex-col justify-between shadow-lg overflow-y-auto">
            <div>
                <!-- شعار أثر -->
                <div class="flex items-center justify-center mb-6 mt-1">
                    <img src="logo.png" alt="شعار أثر" class="w-[195px] object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/195?text=أثر';">
                </div>
                <!-- القائمة -->
                <nav class="space-y-1.5">
                    <a href="dashboard.html" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl text-[#0b253a] hover:bg-blue-500/10 font-semibold transition text-sm">
                        <span>الرئيسية</span>
                        <i class="fa-solid fa-house w-5 text-center"></i>
                    </a>
                    <a href="initiatives.html" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl bg-[#d1e7fb] text-[#0b253a] font-extrabold transition text-sm">
                        <span>المبادرات</span>
                        <i class="fa-solid fa-folder-open w-5 text-center"></i>
                    </a>
                    <a href="#" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl text-[#0b253a] hover:bg-blue-500/10 font-semibold transition text-sm">
                        <span>المؤشرات</span>
                        <i class="fa-solid fa-chart-line w-5 text-center"></i>
                    </a>
                    <a href="#" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl text-[#0b253a] hover:bg-blue-500/10 font-semibold transition text-sm">
                        <span>البيانات</span>
                        <i class="fa-solid fa-database w-5 text-center"></i>
                    </a>
                    <a href="#" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl text-[#0b253a] hover:bg-blue-500/10 font-semibold transition text-sm">
                        <span>التقارير</span>
                        <i class="fa-solid fa-file-lines w-5 text-center"></i>
                    </a>
                    <a href="#" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl text-[#0b253a] hover:bg-blue-500/10 font-semibold transition text-sm">
                        <span>المستفيدون</span>
                        <i class="fa-solid fa-users w-5 text-center"></i>
                    </a>
                    <!-- إعدادات النظام للمشرف -->
                    <div id="adminSettingsMenu" style="display: none;">
                        <a href="#" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl text-[#0b253a] hover:bg-blue-500/10 font-semibold transition text-sm">
                            <span>إعدادات النظام</span>
                            <i class="fa-solid fa-gear w-5 text-center"></i>
                        </a>
                    </div>
                </nav>
            </div>
            <!-- زر تسجيل الخروج -->
            <div class="border-t border-[#0f3d59]/15 pt-3 mt-auto">
                <a href="index.html" class="flex items-center justify-end flex-row-reverse gap-3 px-3 py-2.5 rounded-xl text-[#0b253a] hover:bg-red-500/10 hover:text-red-600 font-bold transition text-sm">
                    <span>تسجيل الخروج</span>
                    <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
                </a>
            </div>
        </aside>
    </div>

    <!-- المحتوى الرئيسي الأيسر -->
    <main class="main-content-area" id="mainContentArea">
        <!-- الهيدر العلوي -->
        <header class="w-full flex justify-between items-center mb-8 relative">
            <div class="text-right">
                <h1 class="text-2xl md:text-3xl font-black text-[#0b253a]">المبادرات</h1>
                <div class="w-12 h-1 bg-[#4e9cd8] rounded mt-1"></div>
            </div>
            
            <!-- شريط اسم المستخدم -->
            <div class="relative" id="userBarContainer">
                <div id="userBarToggle" class="flex items-center gap-2.5 cursor-pointer bg-white/90 px-4 py-1.5 rounded-full shadow-sm hover:bg-white transition backdrop-blur-sm">
                    <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-[#0b253a] shadow-sm">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                    <div class="flex items-center gap-1.5 text-sm font-bold text-[#0b253a]">
                        <span id="displayUserName">مستخدم</span>
                        <i class="fa-solid fa-chevron-down text-xs transition-transform duration-300"></i>
                    </div>
                </div>
                <!-- القائمة المنسدلة للصلاحية -->
                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <span class="text-[11px] text-gray-500 font-semibold px-1.5">صلاحية الحساب</span>
                    <div class="bg-slate-100 text-[#0b253a] px-2.5 py-2 rounded-lg text-xs font-bold flex items-center justify-between">
                        <span id="displayUserRoleText">مستخدم عادي</span>
                        <i class="fa-solid fa-lock text-[#4e9cd8] text-xs"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- زر إضافة مبادرة (يظهر للمشرف فقط) -->
        <div id="adminActionContainer" class="mb-4" style="display: none;">
            <button id="openAddModalBtn" class="bg-[#0b253a] hover:bg-[#16344e] text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-sm transition">
                <i class="fa-solid fa-plus"></i>
                <span>إضافة مبادرة جديدة</span>
            </button>
        </div>

        <!-- أدوات البحث والتصفية -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <select id="categoryFilter" class="p-3 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#4e9cd8] shadow-sm text-[#0b253a] font-medium cursor-pointer">
                <option value="">جميع المجالات</option>
                <option value="التطوير المهني">التطوير المهني</option>
                <option value="التمكين الاقتصادي">التمكين الاقتصادي</option>
                <option value="الأنظمة والتأمين">الأنظمة والتأمين</option>
                <option value="اقتصاد">اقتصاد</option>
            </select>
            <div class="flex-1 bg-white border border-gray-200 rounded-xl px-4 py-3 flex items-center gap-3 shadow-sm focus-within:ring-2 focus-within:ring-[#4e9cd8]">
                <i class="fa-solid fa-search text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن مبادرة أو جهة..." class="w-full text-sm outline-none text-[#0b253a] bg-transparent">
            </div>
        </div>

        <!-- قائمة المبادرات الديناميكية -->
        <div id="cardsContainer" class="space-y-4 pb-10">
            <!-- سيتم تعبئة المبادرات وتحديثها تلقائياً عبر الجافاسكريبت -->
        </div>
    </main>

    <!-- نافذة منبثقة لإضافة أو تعديل مبادرة (Modal) -->
    <div id="initiativeModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-xl relative text-right">
            <h3 id="modalTitle" class="text-xl font-black text-[#0b253a] mb-4">إضافة مبادرة جديدة</h3>
            <form id="initiativeForm" class="space-y-3.5">
                <input type="hidden" id="initiativeIndex">
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اسم المبادرة</label>
                    <input type="text" id="initName" required class="w-full h-11 px-3.5 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#4e9cd8] text-[#0b253a]">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">المجال</label>
                        <select id="initCategory" class="w-full h-11 px-3 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#4e9cd8] text-[#0b253a]">
                            <option value="التطوير المهني">التطوير المهني</option>
                            <option value="التمكين الاقتصادي">التمكين الاقتصادي</option>
                            <option value="الأنظمة والتأمين">الأنظمة والتأمين</option>
                            <option value="اقتصاد">اقتصاد</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الحالة</label>
                        <select id="initStatus" class="w-full h-11 px-3 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#4e9cd8] text-[#0b253a]">
                            <option value="مكتملة">مكتملة</option>
                            <option value="نشطة">نشطة</option>
                            <option value="قيد التنفيذ">قيد التنفيذ</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">المستفيدون</label>
                        <input type="number" id="initBeneficiaries" required class="w-full h-11 px-3 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#4e9cd8] text-[#0b253a]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">تاريخ التنفيذ</label>
                        <input type="date" id="initDate" required class="w-full h-11 px-3 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#4e9cd8] text-[#0b253a]">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">مستوى الأثر (من 5)</label>
                    <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-xl h-11 px-3.5">
                        <input type="number" id="initImpactNum" step="0.01" min="0" max="5" placeholder="أدخل الرقم (مثال: 4.33)" required class="w-full text-sm outline-none bg-transparent text-[#0b253a]">
                        <span class="text-xs font-bold text-gray-500 whitespace-nowrap px-2.5 bg-gray-100 py-1 rounded-lg">/ 5</span>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" id="closeModalBtn" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-bold transition">إلغاء</button>
                    <button type="submit" class="px-5 py-2 bg-[#0b253a] hover:bg-[#16344e] text-white rounded-xl text-sm font-bold transition">حفظ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- سكربت التشغيل الحافظ للبيانات -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const defaultInitiatives = [
                { id: 'samqat', name: 'مبادرة سامقات', category: 'التمكين الاقتصادي', beneficiaries: '17', date: '2025-11-30', impact: '5 / 5', status: 'مكتملة' },
                { id: 'tech', name: 'مبادرة محترف', category: 'التطوير المهني', beneficiaries: '568', date: '2025-09-15', impact: '2.47 / 5', status: 'مكتملة' },
                { id: 'fahim', name: 'مبادرة فهيم', category: 'اقتصاد', beneficiaries: '144', date: '2025-12-11', impact: '4.6 / 5', status: 'نشطة' },
                { id: 'mataheb', name: 'مبادرة متأهب', category: 'الأنظمة والتأمين', beneficiaries: '387', date: '2025-09-15', impact: '5 / 5', status: 'مكتملة' }
            ];

            // جلب البيانات المخزنة مسبقاً أو تعبئة الافتراضية
            let storedInitiatives = localStorage.getItem('athalInitiatives');
            let initiatives = storedInitiatives ? JSON.parse(storedInitiatives) : defaultInitiatives;

            if (!storedInitiatives) {
                localStorage.setItem('athalInitiatives', JSON.stringify(initiatives));
            }

            const savedName = localStorage.getItem('athalUser');
            const savedRole = localStorage.getItem('athalRole');
            const isAdmin = (savedRole === 'admin');

            if (savedName) {
                const displayNameEl = document.getElementById('displayUserName');
                if (displayNameEl) displayNameEl.textContent = savedName;
            }

            const roleTextElement = document.getElementById('displayUserRoleText');
            if (roleTextElement) {
                if (isAdmin) {
                    roleTextElement.textContent = 'مشرف النظام';
                    const adminMenu = document.getElementById('adminSettingsMenu');
                    if (adminMenu) adminMenu.style.display = 'block';
                    const adminActionContainer = document.getElementById('adminActionContainer');
                    if (adminActionContainer) adminActionContainer.style.display = 'block';
                } else {
                    roleTextElement.textContent = 'مستخدم عادي';
                }
            }

            // ألوان المجالات
            function getCategoryBadgeStyle(category) {
                switch(category) {
                    case 'التطوير المهني':
                        return 'background-color: #72b8e018; color: #3a91c2; border: 1px solid #72b8e040;';
                    case 'التمكين الاقتصادي':
                        return 'background-color: #ce8be818; color: #9b4dbf; border: 1px solid #ce8be840;';
                    case 'اقتصاد':
                        return 'background-color: #5ebf5f18; color: #2e8a32; border: 1px solid #5ebf5f40;';
                    case 'الأنظمة والتأمين':
                        return 'background-color: #d9a63818; color: #a6790d; border: 1px solid #d9a63840;';
                    default:
                        return 'background-color: #f3f4f6; color: #374151;';
                }
            }

            // ألوان الحالة
            function getStatusBadgeStyle(status) {
                if (status === 'نشطة') {
                    return 'background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0;';
                } else if (status === 'مكتملة') {
                    return 'background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe;';
                } else if (status === 'قيد التنفيذ') {
                    return 'background-color: #FFE87C; color: #785900; border: 1px solid #fcd34d;';
                } else {
                    return 'background-color: #f3f4f6; color: #374151;';
                }
            }

            // عرض المبادرات
            function renderInitiatives() {
                const container = document.getElementById('cardsContainer');
                container.innerHTML = '';

                initiatives.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = "card bg-white rounded-2xl p-5 border border-gray-100 shadow-sm hover:shadow-md transition flex flex-col md:flex-row items-start md:items-center justify-between gap-4";
                    card.setAttribute('data-category', item.category);
                    card.setAttribute('data-name', item.name);

                    let adminButtonsHTML = '';
                    if (isAdmin) {
                        adminButtonsHTML = `
                            <div class="flex items-center gap-2 mt-2 pt-2 border-t border-gray-100">
                                <button onclick="openEditModal(${index})" class="text-xs bg-amber-50 text-amber-700 hover:bg-amber-100 px-3 py-1 rounded-lg font-bold transition flex items-center gap-1">
                                    <i class="fa-solid fa-pen"></i> تعديل
                                </button>
                                <button onclick="deleteInitiative(${index})" class="text-xs bg-red-50 text-red-700 hover:bg-red-100 px-3 py-1 rounded-lg font-bold transition flex items-center gap-1">
                                    <i class="fa-solid fa-trash"></i> حذف
                                </button>
                            </div>
                        `;
                    }

                    const categoryStyle = getCategoryBadgeStyle(item.category);
                    const statusStyle = getStatusBadgeStyle(item.status);

                    card.innerHTML = `
                        <div class="md:w-1/3 text-right">
                            <h3 class="text-lg font-bold text-[#0b253a] mb-1">${item.name}</h3>
                            <span class="inline-block text-xs font-extrabold px-3 py-1 rounded-full mb-2" style="${categoryStyle}">${item.category}</span>
                            <div>
                                <a href="initiative-details.html?initiative=${item.id || 'samqat'}" class="inline-flex items-center gap-2 bg-slate-100 hover:bg-[#0b253a] hover:text-white text-[#0b253a] text-xs font-bold px-3.5 py-1.5 rounded-lg transition border border-gray-200">
                                    <i class="fa-solid fa-file-lines text-xs"></i>
                                    <span>عرض التفاصيل</span>
                                    <i class="fa-solid fa-angle-left text-xs"></i>
                                </a>
                            </div>
                            ${adminButtonsHTML}
                        </div>
                        <div class="w-full md:w-2/3 grid grid-cols-4 gap-2 text-center border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
                            <div>
                                <span class="block text-xs text-gray-500 mb-1"><i class="fa-solid fa-users text-[10px] ml-1"></i> المستفيدون</span>
                                <span class="text-base font-bold text-[#0b253a]">${item.beneficiaries}</span>
                            </div>
                            <div>
                                <span class="block text-xs text-gray-500 mb-1"><i class="fa-regular fa-calendar text-[10px] ml-1"></i> تاريخ التنفيذ</span>
                                <span class="text-sm font-bold text-[#0b253a]">${item.date}</span>
                            </div>
                            <div>
                                <span class="block text-xs text-gray-500 mb-1"><i class="fa-solid fa-chart-column text-[10px] ml-1"></i> مستوى الأثر</span>
                                <span class="text-base font-bold text-[#0b253a]">${item.impact}</span>
                            </div>
                            <div>
                                <span class="block text-xs text-gray-500 mb-1">الحالة</span>
                                <span class="inline-block text-xs font-extrabold px-3 py-1 rounded-full shadow-sm" style="${statusStyle}">${item.status}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            renderInitiatives();

            // Modal Controls
            const modal = document.getElementById('initiativeModal');
            const openAddBtn = document.getElementById('openAddModalBtn');
            const closeBtn = document.getElementById('closeModalBtn');
            const form = document.getElementById('initiativeForm');

            if (openAddBtn) {
                openAddBtn.addEventListener('click', () => {
                    document.getElementById('modalTitle').textContent = 'إضافة مبادرة جديدة';
                    document.getElementById('initiativeIndex').value = '';
                    form.reset();
                    modal.classList.remove('hidden');
                });
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const index = document.getElementById('initiativeIndex').value;
                const impactVal = document.getElementById('initImpactNum').value;

                const newItem = {
                    id: 'custom_' + Date.now(),
                    name: document.getElementById('initName').value,
                    category: document.getElementById('initCategory').value,
                    beneficiaries: document.getElementById('initBeneficiaries').value,
                    date: document.getElementById('initDate').value,
                    impact: impactVal + ' / 5',
                    status: document.getElementById('initStatus').value
                };

                if (index === '') {
                    initiatives.push(newItem);
                } else {
                    newItem.id = initiatives[index].id;
                    initiatives[index] = newItem;
                }

                // حفظ البيانات بشكل دائم في متصفح المستخدم
                localStorage.setItem('athalInitiatives', JSON.stringify(initiatives));
                modal.classList.add('hidden');
                renderInitiatives();
            });

            window.openEditModal = function(index) {
                const item = initiatives[index];
                document.getElementById('modalTitle').textContent = 'تعديل بيانات المبادرة';
                document.getElementById('initiativeIndex').value = index;
                document.getElementById('initName').value = item.name;
                document.getElementById('initCategory').value = item.category;
                document.getElementById('initBeneficiaries').value = item.beneficiaries;
                document.getElementById('initDate').value = item.date;
                
                const impactNum = item.impact ? item.impact.split('/')[0].trim() : '';
                document.getElementById('initImpactNum').value = impactNum;

                document.getElementById('initStatus').value = item.status;
                modal.classList.remove('hidden');
            };

            window.deleteInitiative = function(index) {
                if (confirm('هل أنت متأكد من رغبتك في حذف هذه المبادرة؟')) {
                    initiatives.splice(index, 1);
                    localStorage.setItem('athalInitiatives', JSON.stringify(initiatives));
                    renderInitiatives();
                }
            };

            // القائمة المنسدلة للمستخدم
            const userBarToggle = document.getElementById('userBarToggle');
            const userDropdownMenu = document.getElementById('userDropdownMenu');
            if (userBarToggle && userDropdownMenu) {
                userBarToggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    userDropdownMenu.classList.toggle('show');
                });
                window.addEventListener('click', () => userDropdownMenu.classList.remove('show'));
            }

            // السهم الجانبي
            const sidebarWrapper = document.getElementById('sidebarWrapper');
            const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
            const toggleIcon = document.getElementById('toggleIcon');
            const bodyElement = document.body;
            if (sidebarToggleBtn && sidebarWrapper) {
                sidebarToggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    sidebarWrapper.classList.toggle('collapsed');
                    bodyElement.classList.toggle('sidebar-is-collapsed');
                    toggleIcon.className = sidebarWrapper.classList.contains('collapsed') ? "fa-solid fa-chevron-left" : "fa-solid fa-chevron-right";
                });
            }

            // البحث والفلترة
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');

            function filterCards() {
                const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
                const selectedCategory = categoryFilter ? categoryFilter.value : '';
                const cards = document.querySelectorAll('#cardsContainer .card');

                cards.forEach(card => {
                    const text = card.innerText.toLowerCase();
                    const category = card.getAttribute('data-category');
                    const matchesSearch = !searchTerm || text.includes(searchTerm);
                    const matchesCategory = !selectedCategory || category === selectedCategory;

                    card.style.display = (matchesSearch && matchesCategory) ? 'flex' : 'none';
                });
            }

            if (searchInput) searchInput.addEventListener('input', filterCards);
            if (categoryFilter) categoryFilter.categoryFilter?.addEventListener('change', filterCards);
            if (categoryFilter) categoryFilter.addEventListener('change', filterCards);
        });
    </script>
</body>
</html>
