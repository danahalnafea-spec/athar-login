<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>منصة أثر - المبادرات</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sidebar-width: 280px;
            --navy: #0b253a;
            --blue: #4e9cd8;
            --page-bg: #f0f7ff;
            --sidebar-bg: #eaf4fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--page-bg);
            background-image: url('bg-dashboard.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            direction: rtl;
            overflow-x: hidden;
        }

        /* الشريط الجانبي */
        .sidebar-wrapper {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            transform: translateX(0);
        }

        .sidebar-wrapper.collapsed {
            transform: translateX(var(--sidebar-width));
        }

        .sidebar-right {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 12px 20px;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.06);
            border-left: 1px solid rgba(15, 61, 89, 0.08);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-top-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .sidebar-logo {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            margin-top: 5px;
        }

        .sidebar-logo img {
            width: 195px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .sidebar-menu {
            list-style: none !important;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            list-style: none !important;
            width: 100%;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-direction: row-reverse;
            gap: 12px;
            padding: 10px 12px;
            color: var(--navy);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .sidebar-menu li.active a {
            background-color: #d1e7fb;
            color: var(--navy);
            font-size: 13.5px;
            font-weight: 600;
        }

        .sidebar-menu li a:hover:not(.active) {
            background-color: rgba(59, 130, 246, 0.08);
        }

        .sidebar-menu li a i {
            font-size: 14px;
            width: 20px;
            text-align: center;
            color: var(--navy);
        }

        .sidebar-bottom-content {
            width: 100%;
            border-top: 1px solid rgba(15, 61, 89, 0.12);
            padding-top: 12px;
            margin-top: auto !important;
            background-color: var(--sidebar-bg);
        }

        .logout-link {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-direction: row-reverse;
            gap: 12px;
            padding: 11px 12px;
            color: var(--navy) !important;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 10px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .logout-link i {
            font-size: 14px;
            color: var(--navy) !important;
            width: 20px;
            text-align: center;
        }

        .logout-link:hover {
            background-color: rgba(220, 38, 38, 0.1);
            color: #dc2626 !important;
        }

        /* زر السهم الثابت ومكان انتقاله بحسب إغلاق القائمة */
        .sidebar-toggle-btn {
            position: fixed !important;
            top: 20px !important;
            right: calc(var(--sidebar-width) + 15px) !important;
            width: 36px;
            height: 36px;
            background-color: var(--navy);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(11, 37, 58, 0.3);
            font-size: 13px;
            z-index: 100000;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, transform 0.3s ease;
        }

        body.sidebar-is-collapsed .sidebar-toggle-btn {
            right: 20px !important;
        }

        .sidebar-toggle-btn:hover {
            background-color: #16344e;
            transform: scale(1.1);
        }

        /* المحتوى الرئيسي: ينسحب ويتمدد عند إغلاق القائمة */
        .main-content-area {
            flex: 1;
            min-height: 100vh;
            padding: 30px 4vw 50px;
            margin-right: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            position: relative;
            min-width: 0;
            overflow-y: auto;
            transition: margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.sidebar-is-collapsed .main-content-area {
            margin-right: 0 !important;
        }

        .header-top-wrapper {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: row;
            margin-top: 1vh;
            margin-bottom: 24px;
            gap: 15px;
            position: relative;
            flex-shrink: 0;
        }

        .page-heading {
            text-align: right;
            min-width: 0;
        }

        .page-heading h1 {
            font-size: clamp(18px, 2.2vw, 28px);
            font-weight: 900;
            color: var(--navy);
            line-height: 1.7;
        }

        .page-heading p {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-top: 3px;
        }

        .heading-underline {
            width: 45px;
            height: 3px;
            background-color: var(--blue);
            border-radius: 2px;
            margin-top: 4px;
        }

        /* اسم المستخدم والقائمة المنسدلة */
        .top-user-bar-container {
            position: relative;
            flex-shrink: 0;
            z-index: 100;
        }

        .top-user-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 16px;
            border-radius: 30px;
            box-shadow: 0 3px 12px rgba(11, 37, 58, 0.08);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .top-user-bar:hover {
            background: #ffffff;
        }

        .user-avatar-circle {
            width: 36px;
            height: 36px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--navy);
            box-shadow: 0 2px 5px rgba(11, 37, 58, 0.1);
            flex-shrink: 0;
        }

        .user-name-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            color: var(--navy);
            white-space: nowrap;
        }

        .user-name-dropdown i {
            font-size: 10px;
            color: var(--navy);
            transition: transform 0.3s ease;
        }

        .top-user-bar.active .user-name-dropdown i {
            transform: rotate(180deg);
        }

        .user-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 170px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(11, 37, 58, 0.12);
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            border: 1px solid rgba(11, 37, 58, 0.08);
            text-align: right;
        }

        .user-dropdown-menu.show {
            display: flex;
        }

        .dropdown-header-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            padding: 0 6px;
        }

        .dropdown-role-display {
            background: #f1f5f9;
            color: var(--navy);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* أدوات البحث والتصفية */
        .filter-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .filter-select,
        .search-box {
            height: 44px;
            border: 1px solid #e5eaf0;
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.96);
            color: var(--navy);
            box-shadow: 0 2px 8px rgba(11, 37, 58, 0.035);
        }

        .filter-select {
            width: 220px;
            max-width: 100%;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .search-box {
            flex: 1;
            min-width: 0;
            padding: 0 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box i {
            color: #94a3b8;
            font-size: 13px;
        }

        .search-box input {
            width: 100%;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: var(--navy);
            font-size: 12px;
        }

        .search-box input::placeholder {
            color: #94a3b8;
        }

        /* التجاوب */
        @media (max-width: 1024px) {
            .sidebar-wrapper {
                transform: translateX(100%);
            }

            .sidebar-wrapper.mobile-open {
                transform: translateX(0);
            }

            .sidebar-toggle-btn {
                position: fixed !important;
                top: 18px !important;
                right: 18px !important;
                left: auto !important;
            }

            .main-content-area {
                margin-right: 0 !important;
                padding: 75px 16px 40px;
            }
        }

        @media (max-width: 600px) {
            .filter-toolbar {
                flex-direction: column;
                gap: 8px;
            }

            .filter-select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- زر السهم الثابت -->
    <button
        class="sidebar-toggle-btn"
        id="sidebarToggleBtn"
        type="button"
        title="إخفاء/إظهار القائمة"
        aria-label="إخفاء أو إظهار القائمة"
        aria-expanded="false">
        <i class="fa-solid fa-chevron-right" id="toggleIcon"></i>
    </button>

    <!-- الشريط الجانبي -->
    <div class="sidebar-wrapper" id="sidebarWrapper">
        <div class="sidebar-right" id="sidebarRight">

            <div class="sidebar-top-content">
                <div class="sidebar-logo">
                    <img src="logo.png" alt="شعار منصة أثر">
                </div>

                <ul class="sidebar-menu">
                    <li>
                        <a href="dashboard.html">
                            <span>الرئيسية</span>
                            <i class="fa-solid fa-house"></i>
                        </a>
                    </li>

                    <li class="active">
                        <a href="initiatives.html">
                            <span>المبادرات</span>
                            <i class="fa-solid fa-folder-open"></i>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span>المؤشرات</span>
                            <i class="fa-solid fa-chart-line"></i>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span>البيانات</span>
                            <i class="fa-solid fa-database"></i>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span>التقارير</span>
                            <i class="fa-solid fa-file-lines"></i>
                        </a>
                    </li>

                    <li>
                        <a href="beneficiaries.html">
                            <span>المستفيدون</span>
                            <i class="fa-solid fa-users"></i>
                        </a>
                    </li>

                    <li id="adminSettingsMenu" style="display: none;">
                        <a href="#">
                            <span>إعدادات النظام</span>
                            <i class="fa-solid fa-gear"></i>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sidebar-bottom-content">
                <a href="index.html" class="logout-link">
                    <span>تسجيل الخروج</span>
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="main-content-area" id="mainContentArea">

        <!-- الهيدر العلوي -->
        <header class="header-top-wrapper">

            <div class="page-heading">
                <h1>المبادرات</h1>
                <div class="heading-underline"></div>
                <p>متابعة واستعراض المبادرات وإنجازاتها</p>
            </div>

            <!-- اسم المستخدم -->
            <div class="top-user-bar-container" id="userBarContainer">

                <div class="top-user-bar" id="userBarToggle" role="button" tabindex="0" aria-expanded="false">
                    <div class="user-avatar-circle">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div class="user-name-dropdown">
                        <span id="displayUserName">مستخدم</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <span class="dropdown-header-label">صلاحية الحساب</span>

                    <div class="dropdown-role-display">
                        <span id="displayUserRoleText">مستخدم عادي</span>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

            </div>
        </header>

        <!-- زر إضافة مبادرة (يظهر للمشرف فقط) -->
        <div id="adminActionContainer" class="mb-5" style="display: none;">
            <button id="openAddModalBtn" class="bg-[#0b253a] hover:bg-[#16344e] text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-sm transition">
                <i class="fa-solid fa-plus"></i>
                <span>إضافة مبادرة جديدة</span>
            </button>
        </div>

        <!-- البحث والتصفية -->
        <section class="filter-toolbar">
            <select id="categoryFilter" class="filter-select">
                <option value="">جميع المجالات</option>
                <option value="التطوير المهني">التطوير المهني</option>
                <option value="التمكين الاقتصادي">التمكين الاقتصادي</option>
                <option value="الأنظمة والتأمين">الأنظمة والتأمين</option>
                <option value="اقتصاد">اقتصاد</option>
            </select>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="searchInput" placeholder="ابحثي عن مبادرة أو جهة...">
            </div>
        </section>

        <!-- حاوية المبادرات -->
        <div id="cardsContainer" class="space-y-4 pb-10">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const savedName = localStorage.getItem('athalUser');
            const savedRole = localStorage.getItem('athalRole');
            const isAdmin = savedRole === 'admin';

            const displayName = document.getElementById('displayUserName');
            const roleText = document.getElementById('displayUserRoleText');
            const adminMenu = document.getElementById('adminSettingsMenu');
            const adminActionContainer = document.getElementById('adminActionContainer');

            if (savedName && displayName) {
                displayName.textContent = savedName;
            }

            if (roleText) {
                roleText.textContent = isAdmin ? 'مشرف النظام' : 'مستخدم عادي';
            }

            if (isAdmin) {
                if (adminMenu) adminMenu.style.display = 'block';
                if (adminActionContainer) adminActionContainer.style.display = 'block';
            }

            const userBarToggle = document.getElementById('userBarToggle');
            const userDropdownMenu = document.getElementById('userDropdownMenu');

            function toggleUserDropdown(event) {
                if (event) event.stopPropagation();
                const isOpen = userDropdownMenu.classList.toggle('show');
                userBarToggle.classList.toggle('active', isOpen);
                userBarToggle.setAttribute('aria-expanded', String(isOpen));
            }

            userBarToggle.addEventListener('click', toggleUserDropdown);

            window.addEventListener('click', function () {
                userDropdownMenu.classList.remove('show');
                userBarToggle.classList.remove('active');
                userBarToggle.setAttribute('aria-expanded', 'false');
            });

            // السايد بار وزر الحركة وانسحاب المحتوى
            const sidebarWrapper = document.getElementById('sidebarWrapper');
            const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
            const toggleIcon = document.getElementById('toggleIcon');
            const bodyElement = document.body;

            function updateSidebarButton(isOpen) {
                if (isOpen) {
                    toggleIcon.classList.remove('fa-chevron-right');
                    toggleIcon.classList.add('fa-chevron-left');
                    sidebarToggleBtn.setAttribute('title', 'إخفاء القائمة');
                    sidebarToggleBtn.setAttribute('aria-expanded', 'true');
                    bodyElement.classList.remove('sidebar-is-collapsed');
                } else {
                    toggleIcon.classList.remove('fa-chevron-left');
                    toggleIcon.classList.add('fa-chevron-right');
                    sidebarToggleBtn.setAttribute('title', 'فتح القائمة');
                    sidebarToggleBtn.setAttribute('aria-expanded', 'false');
                    bodyElement.classList.add('sidebar-is-collapsed');
                }
            }

            sidebarToggleBtn.addEventListener('click', function (event) {
                event.stopPropagation();
                if (window.innerWidth <= 1024) {
                    const isOpen = sidebarWrapper.classList.toggle('mobile-open');
                    updateSidebarButton(isOpen);
                } else {
                    const isCollapsed = sidebarWrapper.classList.toggle('collapsed');
                    updateSidebarButton(!isCollapsed);
                }
            });

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 1024) {
                    if (sidebarWrapper.classList.contains('mobile-open') && 
                        !sidebarWrapper.contains(e.target) && 
                        !sidebarToggleBtn.contains(e.target)) {
                        sidebarWrapper.classList.remove('mobile-open');
                        updateSidebarButton(false);
                    }
                }
            });

            // بيانات المبادرات
            const defaultInitiatives = [
                { id: 'samqat', name: 'مبادرة سامقات', category: 'التمكين الاقتصادي', beneficiaries: '17', date: '2025-11-30', impact: '5 / 5', status: 'مكتملة' },
                { id: 'tech', name: 'مبادرة محترف', category: 'التطوير المهني', beneficiaries: '568', date: '2025-09-15', impact: '2.47 / 5', status: 'مكتملة' },
                { id: 'fahim', name: 'مبادرة فهيم', category: 'اقتصاد', beneficiaries: '144', date: '2025-12-11', impact: '4.6 / 5', status: 'نشطة' },
                { id: 'mataheb', name: 'مبادرة متأهب', category: 'الأنظمة والتأمين', beneficiaries: '387', date: '2025-09-15', impact: '5 / 5', status: 'مكتملة' }
            ];

            let initiatives = [];
            try {
                const savedData = localStorage.getItem('athalInitiatives');
                initiatives = savedData ? JSON.parse(savedData) : defaultInitiatives;
            } catch (error) {
                initiatives = defaultInitiatives;
            }

            function renderInitiatives(items) {
                const container = document.getElementById('cardsContainer');
                if (!container) return;
                container.replaceChildren();

                items.forEach(function (item) {
                    const card = document.createElement('div');
                    card.style.cssText = "background: rgba(255, 255, 255, 0.94); border: 1px solid #e5edf5; border-radius: 14px; padding: 18px; box-shadow: 0 3px 12px rgba(11, 37, 58, 0.05); display: flex; justify-content: space-between; align-items: center; gap: 15px;";
                    
                    card.innerHTML = `
                        <div>
                            <h3 style="color: var(--navy); font-size: 14px; font-weight: 900; margin-bottom: 4px;">${item.name}</h3>
                            <span style="font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; background: #e8f4ff; color: #347eaf;">${item.category}</span>
                        </div>
                        <div>
                            <a href="initiative-details.html?initiative=${item.id}" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: #f1f5f9; color: var(--navy); text-decoration: none; border-radius: 8px; font-size: 10px; font-weight: 800;">
                                <i class="fa-solid fa-file-lines"></i><span>عرض التفاصيل</span>
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            renderInitiatives(initiatives);

            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');

            function filterInitiatives() {
                const term = searchInput.value.toLowerCase();
                const cat = categoryFilter.value;
                const filtered = initiatives.filter(item => {
                    const matchesSearch = !term || item.name.toLowerCase().includes(term);
                    const matchesCat = !cat || item.category === cat;
                    return matchesSearch && matchesCat;
                });
                renderInitiatives(filtered);
            }

            if (searchInput) searchInput.addEventListener('input', filterInitiatives);
            if (categoryFilter) categoryFilter.addEventListener('change', filterInitiatives);

        });
    </script>
</body>
</html>
